name: Atualizar pontuações

on:
  schedule:
    # 10:47 UTC = 7:47 em Brasília, todos os dias
    - cron: "47 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Buscar pontuações na Livelo
        run: python scripts/atualizar.py

      - name: Salvar se mudou
        run: |
          if git diff --quiet -- dados.json; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "radar-livelo[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git commit -m "Atualiza pontuações Livelo"
          git push
